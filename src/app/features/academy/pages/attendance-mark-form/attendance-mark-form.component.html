<div class="attendance-mark-form__history">
  <h3 class="attendance-mark-form__history-title">Katılım Geçmişi</h3>

  <p class="attendance-mark-form__loading" *ngIf="loadingRecords">Yükleniyor...</p>

  <app-empty-state
    *ngIf="!loadingRecords && existingRecords.length === 0"
    message="Bu katılımcı için henüz katılım kaydı yok."
  ></app-empty-state>

  <ul class="attendance-mark-form__record-list" *ngIf="!loadingRecords && existingRecords.length > 0">
    <li *ngFor="let record of existingRecords" class="attendance-mark-form__record">
      <span class="attendance-mark-form__record-lesson">{{ lessonTitle(record.lessonId) }}</span>
      <span class="attendance-mark-form__record-date">{{ record.date | date: 'dd.MM.yyyy' }}</span>
      <span
        class="attendance-mark-form__record-status"
        [class.attendance-mark-form__record-status--absent]="!record.attended"
      >
        {{ record.attended ? 'Katıldı' : 'Katılmadı' }}
      </span>
    </li>
  </ul>
</div>

<h3 class="attendance-mark-form__form-title">Yeni Katılım Kaydı</h3>

<form [formGroup]="form" (ngSubmit)="submit()" class="attendance-mark-form">
  <app-form-field
    label="Ders"
    [control]="form.get('lessonId')"
    [errorMessages]="{ required: 'Ders seçimi zorunludur.' }"
  >
    <select formControlName="lessonId">
      <option value="" disabled>Seçiniz</option>
      <option *ngFor="let lesson of lessons" [value]="lesson.id">{{ lesson.title }}</option>
    </select>
  </app-form-field>

  <app-form-field
    label="Tarih"
    [control]="form.get('date')"
    [errorMessages]="{ required: 'Tarih zorunludur.' }"
  >
    <input type="date" formControlName="date" />
  </app-form-field>

  <label class="attendance-mark-form__checkbox">
    <input type="checkbox" formControlName="attended" />
    Katıldı
  </label>

  <p class="attendance-mark-form__form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="attendance-mark-form__actions">
    <button type="button" class="attendance-mark-form__cancel" (click)="cancel()">İptal</button>
    <button type="submit" class="attendance-mark-form__submit" [disabled]="submitting">
      {{ submitting ? 'Kaydediliyor...' : 'Kaydet' }}
    </button>
  </div>
</form>
