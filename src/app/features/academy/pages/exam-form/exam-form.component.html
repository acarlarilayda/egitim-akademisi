<form [formGroup]="form" (ngSubmit)="submit()" class="exam-form">
  <app-form-field
    label="Kurs"
    [control]="form.get('courseId')"
    [errorMessages]="{ required: 'Kurs seçimi zorunludur.' }"
  >
    <select formControlName="courseId" appAutofocus>
      <option value="" disabled>Seçiniz</option>
      <option *ngFor="let course of courses" [value]="course.id">{{ course.title }}</option>
    </select>
  </app-form-field>

  <app-form-field
    label="Sınav Adı"
    [control]="form.get('title')"
    [errorMessages]="{ required: 'Sınav adı zorunludur.', whitespace: 'Sınav adı sadece boşluk olamaz.' }"
  >
    <input type="text" formControlName="title" />
  </app-form-field>

  <app-form-field
    label="Süre (dakika)"
    [control]="form.get('durationMinutes')"
    [errorMessages]="{ required: 'Süre zorunludur.', notPositive: 'Süre 0’dan büyük olmalıdır.' }"
  >
    <input type="number" formControlName="durationMinutes" />
  </app-form-field>

  <p class="exam-form__form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="exam-form__actions">
    <button type="button" class="exam-form__cancel" (click)="cancel()">İptal</button>
    <button type="submit" class="exam-form__submit" [disabled]="submitting">
      {{ submitting ? 'Kaydediliyor...' : (isEditMode ? 'Güncelle' : 'Oluştur') }}
    </button>
  </div>
</form>
