<form [formGroup]="form" (ngSubmit)="submit()" class="certificate-evaluate-form">
  <app-form-field
    label="Kurs"
    [control]="form.get('courseId')"
    [errorMessages]="{ required: 'Kurs seçimi zorunludur.' }"
  >
    <select formControlName="courseId">
      <option value="" disabled>Seçiniz</option>
      <option *ngFor="let course of courses" [value]="course.id">{{ course.title }}</option>
    </select>
  </app-form-field>

  <app-form-field
    label="Katılımcı"
    [control]="form.get('participantId')"
    [errorMessages]="{ required: 'Katılımcı seçimi zorunludur.' }"
  >
    <select formControlName="participantId">
      <option value="" disabled>Seçiniz</option>
      <option *ngFor="let participant of participants" [value]="participant.id">{{ participant.fullName }}</option>
    </select>
  </app-form-field>

  <p class="certificate-evaluate-form__hint">
    Katılım oranı ve sınav başarı durumu otomatik olarak hesaplanacaktır.
  </p>

  <p class="certificate-evaluate-form__form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="certificate-evaluate-form__actions">
    <button type="button" class="certificate-evaluate-form__cancel" (click)="cancel()">İptal</button>
    <button type="submit" class="certificate-evaluate-form__submit" [disabled]="submitting">
      {{ submitting ? 'Değerlendiriliyor...' : 'Değerlendir' }}
    </button>
  </div>
</form>
