<div class="page">
  <div class="page__header">
    <h1>Sertifikalar</h1>
    <button type="button" class="page__new-button" (click)="openEvaluateDialog()">+ Değerlendir</button>
  </div>

  <div class="page__filters">
    <input
      type="text"
      class="page__search"
      placeholder="Katılımcı adına göre ara..."
      appDebounceInput
      [debounceMs]="300"
      (debouncedInput)="onSearchChange($event)"
    />

    <select class="page__status-filter" [(ngModel)]="statusFilter">
      <option value="">Tüm Durumlar</option>
      <option *ngFor="let status of statusOptions" [value]="status">{{ status }}</option>
    </select>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="filteredEligibilities"
    [loading]="loading()"
    [errorMessage]="errorMessage"
    emptyMessage="Arama/filtre kriterlerine uyan sertifika kaydı bulunamadı."
    (retry)="load()"
  >
    <ng-template dtCell="participantId" let-value>
      {{ participantName(value) }}
    </ng-template>

    <ng-template dtCell="courseId" let-value>
      {{ courseTitle(value) }}
    </ng-template>

    <ng-template dtCell="attendanceRate" let-value>
      %{{ value }}
    </ng-template>

    <ng-template dtCell="examPassed" let-value>
      {{ value ? 'Geçti' : 'Kaldı' }}
    </ng-template>

    <ng-template dtCell="status" let-value>
      <span class="status-badge" [attr.data-status]="value">{{ value }}</span>
    </ng-template>

    <ng-template dtCell="actions" let-row="row">
      <button
        type="button"
        class="issue-button"
        *ngIf="row.status === Status.Eligible"
        (click)="issueCertificate(row.id)"
      >
        Sertifika Ver
      </button>
    </ng-template>
  </app-data-table>
</div>

<app-dialog [open]="dialogOpen" title="Sertifika Uygunluğu Değerlendir" (closed)="onDialogClosed()">
  <app-certificate-evaluate-form
    [courses]="courses"
    [participants]="participants"
    (saved)="onSaved()"
    (cancelled)="onDialogClosed()"
  ></app-certificate-evaluate-form>
</app-dialog>
