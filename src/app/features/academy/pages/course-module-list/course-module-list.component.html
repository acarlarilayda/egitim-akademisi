<div class="page">
  <div class="page__header">
    <h1>Modüller</h1>
    <button type="button" class="page__new-button" (click)="openCreateDialog()">+ Yeni Modül</button>
  </div>

  <div class="page__filters">
    <input
      type="text"
      class="page__search"
      placeholder="Modül adına göre ara..."
      appDebounceInput
      [debounceMs]="300"
      (debouncedInput)="onSearchChange($event)"
    />

    <select class="page__status-filter" [(ngModel)]="courseFilter">
      <option value="">Tüm Kurslar</option>
      <option *ngFor="let course of courses" [value]="course.id">{{ course.title }}</option>
    </select>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="filteredModules"
    [loading]="loading()"
    [errorMessage]="errorMessage"
    emptyMessage="Arama/filtre kriterlerine uyan modül bulunamadı."
    (retry)="load()"
  >
    <ng-template dtCell="courseId" let-value>
      {{ courseTitle(value) }}
    </ng-template>

    <ng-template dtCell="actions" let-row="row">
      <button type="button" class="link-button" (click)="openEditDialog(row)">Düzenle</button>
    </ng-template>
  </app-data-table>
</div>

<app-dialog
  [open]="dialogOpen"
  [title]="editingModule ? 'Modülü Düzenle' : 'Yeni Modül'"
  (closed)="onDialogClosed()"
>
  <app-course-module-form
    [courseModule]="editingModule"
    [courses]="courses"
    (saved)="onSaved()"
    (cancelled)="onDialogClosed()"
  ></app-course-module-form>
</app-dialog>
