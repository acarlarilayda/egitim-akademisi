<div class="page">
  <div class="page__header">
    <h1>Sınavlar</h1>
    <button type="button" class="page__new-button" (click)="openCreateDialog()">+ Yeni Sınav</button>
  </div>

  <div class="page__filters">
    <input
      type="text"
      class="page__search"
      placeholder="Sınav adına göre ara..."
      appDebounceInput
      [debounceMs]="300"
      (debouncedInput)="onSearchChange($event)"
    />

    <select class="page__status-filter" [(ngModel)]="courseFilter">
      <option value="">Tüm Kurslar</option>
      <option *ngFor="let course of courses" [value]="course.id">{{ course.title }}</option>
    </select>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="filteredExams"
    [loading]="loading()"
    [errorMessage]="errorMessage"
    emptyMessage="Arama/filtre kriterlerine uyan sınav bulunamadı."
    (retry)="load()"
  >
    <ng-template dtCell="courseId" let-value>
      {{ courseTitle(value) }}
    </ng-template>

    <ng-template dtCell="actions" let-row="row">
      <a class="link-button" [routerLink]="['/sinavlar', row.id, 'sorular']">Sorular</a>
      <button type="button" class="link-button" (click)="openEditDialog(row)">Düzenle</button>
    </ng-template>
  </app-data-table>
</div>

<app-dialog [open]="dialogOpen" [title]="editingExam ? 'Sınavı Düzenle' : 'Yeni Sınav'" (closed)="onDialogClosed()">
  <app-exam-form
    [exam]="editingExam"
    [courses]="courses"
    (saved)="onSaved()"
    (cancelled)="onDialogClosed()"
  ></app-exam-form>
</app-dialog>
