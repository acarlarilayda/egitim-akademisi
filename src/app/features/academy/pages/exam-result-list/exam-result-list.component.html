<div class="page">
  <div class="page__header">
    <h1>Sonuçlar</h1>
    <button type="button" class="page__new-button" (click)="openCreateDialog()">+ Sonuç Kaydet</button>
  </div>

  <div class="page__filters">
    <input
      type="text"
      class="page__search"
      placeholder="Katılımcı adına göre ara..."
      appDebounceInput
      [debounceMs]="300"
      (debouncedInput)="onSearchChange($event)"
    />

    <select class="page__status-filter" [(ngModel)]="resultFilter">
      <option value="">Tüm Sonuçlar</option>
      <option value="gecti">Geçti</option>
      <option value="kaldi">Kaldı</option>
    </select>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="filteredResults"
    [loading]="loading()"
    [errorMessage]="errorMessage"
    emptyMessage="Arama/filtre kriterlerine uyan sınav sonucu bulunamadı."
    (retry)="load()"
  >
    <ng-template dtCell="participantId" let-value>
      {{ participantName(value) }}
    </ng-template>

    <ng-template dtCell="examId" let-value>
      {{ examTitle(value) }}
    </ng-template>

    <ng-template dtCell="isPassed" let-value>
      <span class="status-badge" [attr.data-status]="value ? 'gecti' : 'kaldi'">
        {{ value ? 'Geçti' : 'Kaldı' }}
      </span>
    </ng-template>
  </app-data-table>
</div>

<app-dialog [open]="dialogOpen" title="Sonuç Kaydet" (closed)="onDialogClosed()">
  <app-exam-result-form
    [exams]="exams"
    [participants]="participants"
    [courses]="courses"
    (saved)="onSaved()"
    (cancelled)="onDialogClosed()"
  ></app-exam-result-form>
</app-dialog>
