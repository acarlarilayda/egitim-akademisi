<div class="page">
  <div class="page__header">
    <h1>Kurslar</h1>
    <button type="button" class="page__new-button" (click)="openCreateDialog()">+ Yeni Kurs</button>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="courses"
    [loading]="loading()"
    [errorMessage]="errorMessage"
    emptyMessage="Henüz kayıtlı kurs yok."
    (retry)="load()"
  >
    <ng-template dtCell="status" let-value>
      <span class="status-badge" [attr.data-status]="value">{{ value }}</span>
    </ng-template>

    <ng-template dtCell="startDate" let-value>
      {{ value | date: 'dd.MM.yyyy' }}
    </ng-template>

    <ng-template dtCell="actions" let-row="row">
      <a [routerLink]="['/kurslar', row.id]">Detay</a>
      <button type="button" class="link-button" (click)="openEditDialog(row)">Düzenle</button>
    </ng-template>
  </app-data-table>
</div>

<app-dialog
  [open]="dialogOpen"
  [title]="editingCourse ? 'Kursu Düzenle' : 'Yeni Kurs'"
  (closed)="onDialogClosed()"
>
  <app-course-form
    [course]="editingCourse"
    [instructors]="instructors"
    (saved)="onSaved()"
    (cancelled)="onDialogClosed()"
  ></app-course-form>
</app-dialog>
