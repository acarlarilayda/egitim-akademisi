<form [formGroup]="form" (ngSubmit)="submit()" class="course-module-form">
  <app-form-field
    label="Kurs"
    [control]="form.get('courseId')"
    [errorMessages]="{ required: 'Kurs seçimi zorunludur.' }"
  >
    <select formControlName="courseId">
      <option value="" disabled>Seçiniz</option>
      <option *ngFor="let course of courses" [value]="course.id">{{ course.title }}</option>
    </select>
  </app-form-field>

  <app-form-field
    label="Modül Adı"
    [control]="form.get('title')"
    [errorMessages]="{ required: 'Modül adı zorunludur.', whitespace: 'Modül adı sadece boşluk olamaz.' }"
  >
    <input type="text" formControlName="title" />
  </app-form-field>

  <app-form-field
    label="Sıra"
    [control]="form.get('order')"
    [errorMessages]="{ required: 'Sıra zorunludur.', notPositive: 'Sıra 0’dan büyük olmalıdır.' }"
  >
    <input type="number" formControlName="order" />
  </app-form-field>

  <p class="course-module-form__form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="course-module-form__actions">
    <button type="button" class="course-module-form__cancel" (click)="cancel()">İptal</button>
    <button type="submit" class="course-module-form__submit" [disabled]="submitting">
      {{ submitting ? 'Kaydediliyor...' : (isEditMode ? 'Güncelle' : 'Oluştur') }}
    </button>
  </div>
</form>
