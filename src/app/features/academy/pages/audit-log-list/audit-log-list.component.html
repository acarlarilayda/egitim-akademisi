<div class="page">
  <div class="page__header">
    <h1>Audit Log</h1>
  </div>

  <div class="page__filters">
    <input
      type="text"
      class="page__search"
      placeholder="Açıklama veya işleme göre ara..."
      appDebounceInput
      [debounceMs]="300"
      (debouncedInput)="onSearchChange($event)"
    />

    <select class="page__status-filter" [(ngModel)]="entityTypeFilter">
      <option value="">Tüm Varlıklar</option>
      <option *ngFor="let entityType of entityTypeOptions" [value]="entityType">{{ entityType }}</option>
    </select>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="filteredEntries"
    [loading]="loading()"
    [errorMessage]="errorMessage"
    emptyMessage="Arama/filtre kriterlerine uyan işlem bulunamadı."
    (retry)="load()"
  >
    <ng-template dtCell="createdAt" let-value>
      {{ value | date: 'dd.MM.yyyy HH:mm' }}
    </ng-template>
  </app-data-table>
</div>
