<div class="page">
  <div class="page__header">
    <h1>Audit Log</h1>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="entries"
    [loading]="loading()"
    [errorMessage]="errorMessage"
    emptyMessage="Henüz kayıtlı işlem yok."
    (retry)="load()"
  >
    <ng-template dtCell="createdAt" let-value>
      {{ value | date: 'dd.MM.yyyy HH:mm' }}
    </ng-template>
  </app-data-table>
</div>
