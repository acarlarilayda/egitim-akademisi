<div class="page">
  <div class="page__header">
    <h1>Katılımcılar</h1>
    <button type="button" class="page__new-button" (click)="openCreateDialog()">+ Yeni Katılımcı</button>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="participants"
    [loading]="loading()"
    [errorMessage]="errorMessage"
    emptyMessage="Henüz kayıtlı katılımcı yok."
    (retry)="load()"
  >
    <ng-template dtCell="isActive" let-value>
      <span class="status-badge" [attr.data-status]="value ? 'aktif' : 'pasif'">
        {{ value ? 'Aktif' : 'Pasif' }}
      </span>
    </ng-template>

    <ng-template dtCell="actions" let-row="row">
      <button type="button" class="link-button" (click)="openEditDialog(row)">Düzenle</button>
    </ng-template>
  </app-data-table>
</div>

<app-dialog
  [open]="dialogOpen"
  [title]="editingParticipant ? 'Katılımcıyı Düzenle' : 'Yeni Katılımcı'"
  (closed)="onDialogClosed()"
>
  <app-participant-form
    [participant]="editingParticipant"
    (saved)="onSaved()"
    (cancelled)="onDialogClosed()"
  ></app-participant-form>
</app-dialog>
