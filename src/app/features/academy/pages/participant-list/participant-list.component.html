<div class="page">
  <div class="page__header">
    <h1>Katılımcılar</h1>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="participants"
    [loading]="loading()"
    [errorMessage]="errorMessage"
    emptyMessage="Henüz kayıtlı katılımcı yok."
    (retry)="load()"
  >
    <ng-template dtCell="isActive" let-value>
      <span class="status-badge" [attr.data-status]="value ? 'aktif' : 'pasif'">
        {{ value ? 'Aktif' : 'Pasif' }}
      </span>
    </ng-template>
  </app-data-table>
</div>
