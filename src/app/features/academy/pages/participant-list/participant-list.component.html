<div class="page">
  <div class="page__header">
    <h1>Katılımcılar</h1>
    <div class="page__header-actions">
      <button type="button" class="page__secondary-button" (click)="exportParticipants()">⭳ Dışa Aktar</button>
      <button
        type="button"
        class="page__secondary-button"
        [disabled]="importing"
        (click)="triggerImport(importFileInput)"
      >
        {{ importing ? 'İçe aktarılıyor...' : '⭱ İçe Aktar' }}
      </button>
      <input
        #importFileInput
        type="file"
        accept="application/json,.json"
        hidden
        (change)="onImportFileSelected($event)"
      />
      <button type="button" class="page__new-button" (click)="openCreateDialog()">+ Yeni Katılımcı</button>
    </div>
  </div>

  <p class="page__import-message" *ngIf="importMessage">✅ {{ importMessage }}</p>
  <p class="page__import-message page__import-message--error" *ngIf="importErrorMessage">⚠️ {{ importErrorMessage }}</p>

  <div class="page__filters">
    <input
      type="text"
      class="page__search"
      placeholder="Ad veya e-postaya göre ara..."
      appDebounceInput
      [debounceMs]="300"
      (debouncedInput)="onSearchChange($event)"
    />

    <select class="page__status-filter" [(ngModel)]="statusFilter">
      <option value="">Tüm Durumlar</option>
      <option value="aktif">Aktif</option>
      <option value="pasif">Pasif</option>
    </select>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="filteredParticipants"
    [loading]="loading()"
    [errorMessage]="errorMessage"
    emptyMessage="Arama/filtre kriterlerine uyan katılımcı bulunamadı."
    (retry)="load()"
  >
    <ng-template dtCell="isActive" let-value>
      <span class="status-badge" [attr.data-status]="value ? 'aktif' : 'pasif'">
        {{ value ? 'Aktif' : 'Pasif' }}
      </span>
    </ng-template>

    <ng-template dtCell="actions" let-row="row">
      <button type="button" class="link-button" (click)="openEditDialog(row)">Düzenle</button>
    </ng-template>
  </app-data-table>
</div>

<app-dialog
  [open]="dialogOpen"
  [title]="editingParticipant ? 'Katılımcıyı Düzenle' : 'Yeni Katılımcı'"
  (closed)="onDialogClosed()"
>
  <app-participant-form
    [participant]="editingParticipant"
    (saved)="onSaved()"
    (cancelled)="onDialogClosed()"
  ></app-participant-form>
</app-dialog>
