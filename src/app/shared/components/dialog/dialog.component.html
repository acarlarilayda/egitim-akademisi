<div class="dialog-backdrop" *ngIf="open" (click)="onBackdropClick()">
  <div class="dialog" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
    <div class="dialog__header">
      <h2 class="dialog__title">{{ title }}</h2>
      <button type="button" class="dialog__close" (click)="close()" aria-label="Kapat">✕</button>
    </div>
    <div class="dialog__body">
      <ng-content></ng-content>
    </div>
  </div>
</div>
